<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>السامي لإدارة الورشة — واجهة (نهائية)</title>

  <!-- خط عربي جذاب -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">🛠️</div>
      <div class="brand-txt">
        <div class="title">السامي لإدارة الورشة</div>
        <div class="sub">واجهة أمامية — نسخة نهائية</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">غير متصل</span>
      </div>
      <button id="btnSettings" class="icon-btn" title="الإعدادات">⚙️</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- نافذة الإعدادات -->
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <div class="row-inline">
          <span class="modal-icon">⚙️</span>
          <h3>إعدادات الاتصال</h3>
        </div>
        <button id="closeSettings" class="icon-btn">✖️</button>
      </div>
      <div class="modal-body">
        <label class="label">رابط واجهة البرمجة (API Base)</label>
        <input id="apiBaseInput" class="input" placeholder="مثلًا: http://127.0.0.1:9000/api" />
        <div class="muted">يحفظ تلقائيًا في المتصفح ويُستخدم لكل الطلبات.</div>
      </div>
      <div class="modal-foot">
        <button id="saveApiBase" class="btn primary">حفظ</button>
        <button id="pingApi" class="btn">اختبار الاتصال</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="app.js" defer></script>
</body>
</html>

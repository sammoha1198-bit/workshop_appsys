services:
  # --- Backend (FastAPI) ---
  - type: web
    name: alsami-workshop-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # If you ever switch to Postgres, add DATABASE_URL here. For SQLite, not needed.

  # --- Frontend (static HTML/JS/CSS) ---
  - type: static
    name: alsami-workshop-frontend
    rootDir: frontend          # <-- NO trailing space
    buildCommand: ""           # no build step for plain HTML/JS
    staticPublishPath: .       # publish everything inside /frontend
    autoDeploy: true

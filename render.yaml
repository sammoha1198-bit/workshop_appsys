services:
  - type: web
    name: alsami-workshop-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # استخدم قاعدة بيانات SQLite في مجلد دائم الكتابة على Render
      - key: DB_PATH
        value: /data/workshop.db

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>السامي | نظام إدارة الورشة</title>

  <!-- هوية بصرية: خط عربي واضح -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- رأس ثابت: شعار + بحث + حالة -->
  <!-- رأس الواجهة الرئيسي -->
<header class="topbar-centered">
  <img src="assets/logo.jpg" alt="Logo" class="header-logo" />
  <h1 class="header-title">
    إدارة الورشة – يمن موبايل – المهندس ســــامي قائد – 773792330
  </h1>
</header>



  <!-- حاوية عامة: Mobile First -->
  <div class="shell">
    <!-- قائمة جانبية (تظهر على الشاشات الواسعة أو من زر ☰) -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <div class="nav-section">القائمة الرئيسية</div>
        <button data-view="home" class="nav-item active">الواجهة الرئيسية</button>

        <div class="nav-section">الوحدات</div>
        <button data-view="engines" class="nav-item">لوحة المحركات</button>
        <button data-view="gen-home" class="nav-item">لوحة المولدات</button>

        <div class="nav-section">التقارير</div>
        <button data-view="reports" class="nav-item">التقارير والتصدير</button>
      </nav>
    </aside>

    <!-- منطقة المحتوى -->
    <main class="content">
      <!-- شريط أدوات فوق المحتوى (بحث سريع + تصدير) -->
      <section class="toolbar">
        <div class="toolbar-search">
          <input id="searchInput" class="input search-input"
                 placeholder="بحث سريع: رقم تسلسلي لمحرك أو كود مولد..." />
          <button id="btnSearch" class="btn-primary btn-search">بحث</button>
        </div>
        <button id="btnQuickExport" class="btn-light btn-quick-export">تصدير سريع</button>
      </section>

      <!-- هنا تعرض القوالب -->
      <section id="viewRoot"></section>
    </main>
  </div>

  <!-- نافذة إعدادات API -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>إعدادات الخادم</h3>
        <button id="closeSettings" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>رابط واجهة البرمجة (API Base)</label>
          <input id="apiBaseInput" class="input"
                 placeholder="مثال: https://workshop-appsys.onrender.com/api" />
          
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveApiBase" class="btn-primary flex-grow">حفظ</button>
        <button id="cancelSettings" class="btn-light">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة التصدير -->
  <div id="exportModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>تصدير تقرير Excel</h3>
        <button id="closeExport" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>نوع البيانات</label>
          <div class="chips-row">
            <label class="chip">
              <input type="radio" name="exportType" value="engines" checked>
              المحركات
            </label>
            <label class="chip">
              <input type="radio" name="exportType" value="generators">
              المولدات
            </label>
            <label class="chip">
              <input type="radio" name="exportType" value="both">
              الكل
            </label>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>من تاريخ</label>
            <input id="fromDate" type="date" class="input" />
          </div>
          <div class="field">
            <label>إلى تاريخ</label>
            <input id="toDate" type="date" class="input" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="doExport" class="btn-primary flex-grow">تصدير</button>
        <button id="cancelExport" class="btn-light">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- ================= القوالب (Templates) ================= -->

  <!-- الواجهة الرئيسية: تايلز رئيسية + آخر 3 + الحالة + نتائج البحث -->
  <template id="tpl-home">
    <section class="home">
      <!-- تايلز رئيسية (7 وظائف أساسية) -->
      <div class="card home-grid">
        <div class="card-header">
  <h2 class="card-title">لوحة التحكم الرئيسية</h2>
</div>

        <div class="home-tiles">
          <!-- البحث: يوجّه لنفس الصفحة مع التركيز على خانة البحث -->
          <button class="tile tile-blue" data-go="home">
            <span class="icon">🔍</span>
            <span class="title">البحث</span>
            <span class="subtitle">ابحث مباشرة عن أي محرك أو مولد.</span>
          </button>

          <!-- لوحة المحركات -->
          <button class="tile tile-teal" data-view="engines">
            <span class="icon">🧰</span>
            <span class="title">لوحة المحركات</span>
            <span class="subtitle">توريد، صرف، تأهيل، فحص، رفع، مخرطة، بمبات وكهرباء.</span>
          </button>

          <!-- لوحة المولدات -->
          <button class="tile tile-purple" data-view="gen-home">
            <span class="icon">🔌</span>
            <span class="title">لوحة المولدات</span>
            <span class="subtitle">إدارة كاملة لحركات المولدات.</span>
          </button>

         <button class="tile tile-amber" id="tileLastEngines">
  <span class="icon">📦</span>
  <span class="title">آخر 3 محركات</span>
  <span class="subtitle">عرض أحدث عمليات المحركات.</span>
</button>

<button class="tile tile-amber" id="tileLastGenerators">
  <span class="icon">⚡</span>
  <span class="title">آخر 3 مولدات</span>
  <span class="subtitle">عرض أحدث عمليات المولدات.</span>
</button>




          <!-- التصدير -->
          <button class="tile tile-indigo" data-view="reports">
            <span class="icon">📊</span>
            <span class="title">التصدير</span>
            <span class="subtitle">تقرير Excel رسمي للقيادة.</span>
          </button>


<button class="tile tile-green" id="tileStatus">
  <span class="icon">📈</span>
  <span class="title">حالة النظام</span>
  <span class="subtitle">حالة الخادم والاتصال والإصدار.</span>
</button>

        </div>
      </div>

      <!-- كروت معلومات سريعة -->
      <div class="status-grid">
  <div id="cardLastEngines" class="card hidden">
    <div class="card-title-row">
      <span class="card-title">آخر 3 محركات</span>
      <span class="card-icon">🧰</span>
    </div>
    <div id="last3Engines" class="mt"></div>
  </div>

  <div id="cardLastGenerators" class="card hidden">
    <div class="card-title-row">
      <span class="card-title">آخر 3 مولدات</span>
      <span class="card-icon">🔌</span>
    </div>
    <div id="last3Generators" class="mt"></div>
  </div>

  <div id="cardStatus" class="card hidden">
    <div class="card-title-row">
      <span class="card-title">حالة النظام</span>
      <span class="card-icon">📊</span>
    </div>
    <ul class="status-list">
      <li>اتصال الخادم: <span id="srvStatus" class="tag ok">جيد</span></li>
      <li>إصدار الواجهة: <span class="tag">v4.0</span></li>
      <li>المطور: <span class="tag">ALSAMI</span></li>
    </ul>
  </div>
</div>


      <!-- نتائج البحث -->
      <div class="card" id="searchCard">
        <div class="card-title-row">
          <span class="card-title">نتائج البحث</span>
          <span class="card-icon">🔎</span>
        </div>
        <div id="searchOutput" class="mt"></div>
      </div>
    </section>
  </template>

  <!-- لوحة المحركات: مجرد مدخل لباقي النماذج -->
  <template id="tpl-engines">
    <section class="view">
      <div class="view-head">
        <button class="btn-back" data-return>الرجوع للرئيسية</button>
        <h2>لوحة المحركات</h2>
      </div>
      
      <div class="tiles-wrap">
        <button class="tile tile-teal" data-view="eng-supply">
          <span class="icon">➕</span>
          <span class="title">توريد محرك</span>
          <span class="subtitle">تسجيل محرك جديد في المخزون.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-issue">
          <span class="icon">📤</span>
          <span class="title">صرف محرك</span>
          <span class="subtitle">توجيه محرك لموقع أو جهة.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-rehab">
          <span class="icon">🛠️</span>
          <span class="title">تأهيل محرك</span>
          <span class="subtitle">تسجيل أعمال الإصلاح والتأهيل.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-check">
          <span class="icon">📋</span>
          <span class="title">فحص محرك</span>
          <span class="subtitle">نتائج الفحوصات الفنية.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-upload">
          <span class="icon">⬆️</span>
          <span class="title">رفع مؤهل/فحص</span>
          <span class="subtitle">توثيق استلام تقارير التأهيل.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-lathe">
          <span class="icon">⚙️</span>
          <span class="title">مخرطة</span>
          <span class="subtitle">عمليات المخرطة على الأجزاء.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-pump">
          <span class="icon">💧</span>
          <span class="title">بمبات ونوزلات</span>
          <span class="subtitle">إصلاح أو استبدال وحدات الحقن.</span>
        </button>
        <button class="tile tile-teal" data-view="eng-elec">
          <span class="icon">⚡</span>
          <span class="title">كهرباء</span>
          <span class="subtitle">السلف، الدينمو، الأعمال الكهربائية.</span>
        </button>
      </div>
    </section>
  </template>

  <!-- نماذج المحركات (نفس الآلية القديمة مع تحسين بسيط في الشكل) -->
  <template id="tpl-eng-supply">
    <section class="view">
      <div class="view-head">
        <button class="btn-back" data-return>رجوع</button>
        <h2>توريد محرك</h2>
      </div>
      <form class="card form" data-store="eng_supply">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>نوع المحرك</label><input name="engineType" class="input" placeholder="Deutz / Perkins / ..."></div>
          <div class="field"><label>الموديل</label><input name="model" class="input" placeholder="F4L912 / 404D-22 ..."></div>
          <div class="field"><label>الموقع السابق</label><input name="prevSite" class="input"></div>
          <div class="field"><label>تاريخ التوريد</label><input name="supDate" type="date" class="input"></div>
          <div class="field"><label>المورّد</label><input name="supplier" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input" rows="2"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-issue">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>صرف محرك</h2></div>
      <form class="card form" data-store="eng_issue">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>الموقع الحالي</label><input name="currSite" class="input"></div>
          <div class="field"><label>المستلم</label><input name="receiver" class="input"></div>
          <div class="field"><label>الطالب</label><input name="requester" class="input"></div>
          <div class="field"><label>تاريخ الصرف</label><input name="issueDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-rehab">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>تأهيل محرك</h2></div>
      <form class="card form" data-store="eng_rehab">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>الجهة المؤهلة</label><input name="rehabber" class="input"></div>
          <div class="field"><label>نوع التأهيل</label><input name="rehabType" class="input"></div>
          <div class="field"><label>تاريخ التأهيل</label><input name="rehabDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-check">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>فحص محرك</h2></div>
      <form class="card form" data-store="eng_check">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>الفاحص</label><input name="inspector" class="input"></div>
          <div class="field grid-full"><label>وصف الفحص</label><textarea name="desc" class="input" rows="2"></textarea></div>
          <div class="field"><label>تاريخ الفحص</label><input name="checkDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-upload">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>رفع مؤهل/فحص</h2></div>
      <form class="card form" data-store="eng_upload">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>رفع المؤهل</label><input name="rehabUp" class="input" placeholder="نعم / لا"></div>
          <div class="field"><label>رفع الفحص</label><input name="checkUp" class="input" placeholder="نعم / لا"></div>
          <div class="field"><label>تاريخ رفع المؤهل</label><input name="rehabUpDate" type="date" class="input"></div>
          <div class="field"><label>تاريخ رفع الفحص</label><input name="checkUpDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-lathe">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>مخرطة</h2></div>
      <form class="card form" data-store="eng_lathe">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field grid-full"><label>تفاصيل المخرطة</label><textarea name="lathe" class="input"></textarea></div>
          <div class="field"><label>تاريخ المخرطة</label><input name="latheDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-pump">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>بمبات ونوزلات</h2></div>
      <form class="card form" data-store="eng_pump">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>رقم البمب</label><input name="pumpSerial" class="input"></div>
          <div class="field grid-full"><label>تأهيل البمب</label><textarea name="pumpRehab" class="input"></textarea></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-elec">
    <section class="view">
      <div class="view-head"><button class="btn-back" data-return>رجوع</button><h2>قسم الكهرباء</h2></div>
      <form class="card form" data-store="eng_electrical">
        <div class="grid-2">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>نوع العمل</label><input name="etype" class="input" placeholder="كهرباء كاملة / ..."></div>
          <div class="field"><label>سلف</label><input name="starter" class="input" placeholder="نعم / لا"></div>
          <div class="field"><label>دينمو</label><input name="alternator" class="input" placeholder="نعم / لا"></div>
          <div class="field"><label>التاريخ</label><input name="edate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary flex-grow">حفظ</button>
          <button type="button" class="btn-light" data-sync>مزامنة ↻</button>
        </div>
      </form>
    </section>
  </template>

  <!-- لوحة المولدات (Hub) -->
  <template id="gen-home-tpl">
    <section class="view">
      <div class="view-head">
        <button class="btn-back" data-return>رجوع</button>
        <h2>لوحة المولدات</h2>
      </div>
    
      <div class="tiles-wrap">
        <button class="tile tile-purple" data-go="gen-supply">
          <span class="icon">➕</span>
          <span class="title">توريد مولد</span>
          <span class="subtitle">تسجيل مولد جديد مع بياناته الكاملة.</span>
        </button>
        <button class="tile tile-purple" data-go="gen-issue">
          <span class="icon">📤</span>
          <span class="title">صرف مولد</span>
          <span class="subtitle">توجيه مولد لموقع وتشغيل.</span>
        </button>
        <button class="tile tile-purple" data-go="gen-inspect">
          <span class="icon">📝</span>
          <span class="title">فحص / رفع مولد</span>
          <span class="subtitle">توثيق حالة المولد بعد الفحص.</span>
        </button>
      </div>
    </section>
  </template>

  <!-- نماذج المولدات (كما كانت مع تحسين شكل) -->
  <template id="gen-supply-tpl">
    <section class="view">
      <div class="view-head">
        <button class="btn-back" data-return>رجوع</button>
        <h2>توريد مولد</h2>
      </div>
      <form id="gen-supply-form" class="card form">
        <div class="grid-2">
          <div class="field"><label>الكود *</label><input id="gen_code" required class="input" /></div>
          <div class="field"><label>السعة</label><input id="gen_gType" class="input" placeholder="30kVA" /></div>
          <div class="field"><label>الموديل</label><input id="gen_model" class="input" /></div>
          <div class="field"><label>الموقع السابق</label><input id="gen_prevSite" class="input" /></div>
          <div class="field"><label>تاريخ التوريد</label><input id="gen_supDate" type="date" class="input" /></div>
          <div class="field"><label>الجهة</label><input id="gen_supplier" class="input" placeholder="Yemen Mobile" /></div>
          <div class="field"><label>المورّد</label><input id="gen_vendor" class="input" placeholder="PowerMax ..." /></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea id="gen_notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">

          <button type="submit" class="btn-primary flex-grow">حفظ</button>
        </div>
      </form>
    </section>

  <template id="gen-inspect-tpl">
    <section class="view">
      <div class="view-head">

          <div class="field"><label>رفع المؤهل</label><input id="gins_rehabUp" class="input" placeholder="نعم / لا" /></div>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>السامي لإدارة الورشة</title>

  <!-- هوية خط موحدة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0b2a45">
</head>
<body>

  <!-- شريط علوي (ثابت - هوية + حالة النظام + مستخدم) -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-logo-mark">
        <!-- يمكن استبدالها بشعار الشركة الفعلي -->
        <span class="brand-icon-gear"></span>
      </div>
      <div class="brand-text">
        <div class="brand-title">السامي لإدارة الورشة</div>
        <div class="brand-sub">نظام محركات ومولدات للشركات</div>
      </div>
    </div>

    <div class="topbar-status">
      <div class="status-pill" id="systemStatusPill">
        <span id="onlineDot" class="dot online"></span>
        <span id="onlineText" class="status-text">متصل بالخادم</span>
      </div>
      <div class="topbar-meta">
        <span class="meta-label">آخر مزامنة:</span>
        <span id="lastSync" class="meta-value">—</span>
      </div>
      <button id="btnSettings" class="icon-btn" title="إعدادات الاتصال">
        <span class="icon icon-settings"></span>
      </button>
      <button id="btnBell" class="icon-btn" title="الإشعارات">
        <span class="icon icon-bell"></span>
        <span id="bellCount" class="badge">0</span>
      </button>
      <button id="btnLogout" class="pill-btn pill-danger" title="تسجيل الخروج">
        <span class="icon icon-logout"></span>
        <span>خروج</span>
      </button>
    </div>
  </header>

  <!-- منطقة التطبيق -->
  <main id="app" class="app">
    <!-- سيتم حقن القوالب هنا -->
    <section id="viewRoot" class="view-root"></section>
  </main>

  <!-- شريط تنقل سفلي (Mobile-First) -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-view="home">
      <span class="icon icon-home"></span>
      <span>الرئيسية</span>
    </button>
    <button class="bottom-nav-item" data-view="search">
      <span class="icon icon-search"></span>
      <span>بحث</span>
    </button>
    <button class="bottom-nav-item" data-view="engines">
      <span class="icon icon-engine"></span>
      <span>المحركات</span>
    </button>
    <button class="bottom-nav-item" data-view="gen-home">
      <span class="icon icon-generator"></span>
      <span>المولدات</span>
    </button>
    <button class="bottom-nav-item" data-view="reports">
      <span class="icon icon-report"></span>
      <span>التقارير</span>
    </button>
  </nav>

  <!-- نافذة إعدادات API -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>إعدادات الاتصال بالخادم</h3>
        <button id="closeSettings" class="icon-btn">
          <span class="icon icon-close"></span>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>رابط API</label>
          <input id="apiBaseInput" class="input" placeholder="مثال: https://workshop-appsys.onrender.com/api" />
          <div class="hint">استخدم الرابط الرسمي للبيئة الإنتاجية، أو رابط محلي عند الاختبار الداخلي.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveApiBase" class="btn primary">حفظ</button>
        <button id="cancelSettings" class="btn ghost">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة التصدير -->
  <div id="exportModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>تصدير إلى Excel</h3>
        <button id="closeExport" class="icon-btn">
          <span class="icon icon-close"></span>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>نوع البيانات</label>
          <div class="chip-row">
            <label class="chip">
              <input type="radio" name="exportType" value="engines" checked>
              <span>المحركات</span>
            </label>
            <label class="chip">
              <input type="radio" name="exportType" value="generators">
              <span>المولدات</span>
            </label>
            <label class="chip">
              <input type="radio" name="exportType" value="both">
              <span>الكل</span>
            </label>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>من تاريخ</label>
            <input id="fromDate" type="date" class="input" />
          </div>
          <div class="field">
            <label>إلى تاريخ</label>
            <input id="toDate" type="date" class="input" />
          </div>
        </div>
        <div class="hint">اترك التواريخ فارغة لتصدير جميع السجلات المصرح بها.</div>
      </div>
      <div class="modal-footer">
        <button id="doExport" class="btn primary">تصدير</button>
        <button id="cancelExport" class="btn ghost">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- ==================== القوالب ==================== -->

  <!-- الرئيسية: لوحة تحكم تنفيذية بدون تكرار -->
  <template id="tpl-home">
    <section class="home-view">

      <!-- كرت حالة النظام -->
      <div class="card status-card">
        <div class="status-card-header">
          <div>
            <div class="status-label">حالة النظام</div>
            <div class="status-summary">
              <span id="srvStatus" class="tag ok">النظام يعمل بشكل طبيعي</span>
            </div>
          </div>
          <div class="status-meta">
            <div>إصدار الواجهة: <span class="tag">v4.0</span></div>
            <div>مطور النظام: <span class="tag">ALSAMI</span></div>
          </div>
        </div>
        <div class="status-indicators">
          <div class="indicator">
            <span class="indicator-label">إجمالي المحركات</span>
            <span id="totalEngines" class="indicator-value">—</span>
          </div>
          <div class="indicator">
            <span class="indicator-label">إجمالي المولدات</span>
            <span id="totalGenerators" class="indicator-value">—</span>
          </div>
          <div class="indicator">
            <span class="indicator-label">تنبيهات حرجة</span>
            <span id="criticalAlerts" class="indicator-value critical">0</span>
          </div>
        </div>
      </div>

      <!-- كرت بحث سريع (مباشر وواضح) -->
      <div class="card search-card">
        <div class="card-title-row">
          <h3>بحث سريع</h3>
          <span class="card-sub">بحث برقم تسلسلي، كود، أو موقع</span>
        </div>
        <div class="search-inline">
          <input id="searchInput"
                 class="input main-search"
                 placeholder="اكتب هنا: رقم تسلسلي محرك، كود مولد، أو كلمة مفتاحية..." />
          <button id="btnSearch" class="btn primary">
            <span class="icon icon-search"></span>
            <span>بحث</span>
          </button>
        </div>
        <div class="search-filters">
          <button class="chip small" data-filter="all">الكل</button>
          <button class="chip small" data-filter="engine">محركات</button>
          <button class="chip small" data-filter="generator">مولدات</button>
          <button class="chip small" data-filter="today">عمليات اليوم</button>
        </div>
      </div>

      <!-- شبكة الإجراءات الرئيسية (بدون تكرار غير ضروري) -->
      <div class="tile-grid home-tiles">
        <button class="tile" data-view="engines">
          <span class="icon icon-engine tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">لوحة المحركات</div>
            <div class="tile-sub">إضافة، صرف، تأهيل، وفحص المحركات</div>
          </div>
        </button>

        <button class="tile" data-view="gen-home">
          <span class="icon icon-generator tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">لوحة المولدات</div>
            <div class="tile-sub">إدارة توريد وصرف وفحص المولدات</div>
          </div>
        </button>

        <button class="tile" data-view="reports">
          <span class="icon icon-report tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">التقارير والتصدير</div>
            <div class="tile-sub">تصدير تقارير Excel رسمية</div>
          </div>
        </button>

        <button class="tile" data-action="open-latest">
          <span class="icon icon-clock tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">آخر العمليات</div>
            <div class="tile-sub">أحدث 3 محركات و 3 مولدات تم التعامل معها</div>
          </div>
        </button>

        <button class="tile" data-action="open-status">
          <span class="icon icon-health tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">مؤشرات الحالة</div>
            <div class="tile-sub">عرض أداء النظام وحالة الاتصال</div>
          </div>
        </button>
      </div>

      <!-- كرت آخر العمليات (بدون تكرار كبلاطة منفصلة) -->
      <div class="card latest-card">
        <div class="card-title-row">
          <h3>آخر العمليات</h3>
          <span class="card-sub">نظرة سريعة على آخر 3 محركات و3 مولدات</span>
        </div>
        <div class="latest-grid">
          <div class="latest-column">
            <div class="latest-label">آخر 3 محركات</div>
            <div id="last3Engines" class="metric-list"></div>
          </div>
          <div class="latest-column">
            <div class="latest-label">آخر 3 مولدات</div>
            <div id="last3Generators" class="metric-list"></div>
          </div>
        </div>
      </div>

      <!-- نتائج البحث (تظهر محتوى حقيقي بعد البحث) -->
      <div class="card">
        <div class="card-title-row">
          <h3>نتائج البحث</h3>
          <span class="card-sub">سيتم عرض النتائج هنا بشكل منظم</span>
        </div>
        <div id="searchOutput" class="search-results empty-state">
          <p>ابدأ بالبحث لعرض السجلات المطابقة.</p>
        </div>
      </div>

    </section>
  </template>

  <!-- شاشة البحث المنفصلة (عند اختيارها من شريط التنقل) -->
  <template id="tpl-search">
    <section class="search-view">
      <div class="view-head">
        <h2>بحث متقدم</h2>
      </div>
      <div class="card search-card">
        <div class="search-inline">
          <input id="searchInput"
                 class="input main-search"
                 placeholder="بحث برقم، كود، موقع، أو حالة..." />
          <button id="btnSearch" class="btn primary">
            <span class="icon icon-search"></span>
            <span>بحث</span>
          </button>
        </div>
        <div class="search-filters">
          <button class="chip small" data-filter="all">الكل</button>
          <button class="chip small" data-filter="engine">محركات</button>
          <button class="chip small" data-filter="generator">مولدات</button>
          <button class="chip small" data-filter="active">نشط</button>
          <button class="chip small" data-filter="under_maintenance">تحت الصيانة</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title-row">
          <h3>نتائج البحث</h3>
        </div>
        <div id="searchOutput" class="search-results empty-state">
          <p>لا توجد نتائج بعد. عدّل معايير البحث أو أدخل قيمة جديدة.</p>
        </div>
      </div>
    </section>
  </template>

  <!-- لوحة المحركات -->
  <template id="tpl-engines">
    <section class="panel">
      <div class="view-head">
        <h2>لوحة المحركات</h2>
        <p class="view-sub">إدارة دورة حياة المحركات بالكامل.</p>
      </div>
      <div class="tile-grid">
        <button class="tile" data-view="eng-supply">
          <span class="icon icon-add tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">توريد محرك</div>
            <div class="tile-sub">تسجيل محرك جديد داخل النظام</div>
          </div>
        </button>
        <button class="tile" data-view="eng-issue">
          <span class="icon icon-exit tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">صرف محرك</div>
            <div class="tile-sub">تحويل محرك لموقع أو جهة</div>
          </div>
        </button>
        <button class="tile" data-view="eng-rehab">
          <span class="icon icon-rehab tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">تأهيل محرك</div>
            <div class="tile-sub">تسجيل أعمال التأهيل والصيانة</div>
          </div>
        </button>
        <button class="tile" data-view="eng-check">
          <span class="icon icon-check tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">فحص محرك</div>
            <div class="tile-sub">نتائج الفحوصات الفنية</div>
          </div>
        </button>
        <button class="tile" data-view="eng-upload">
          <span class="icon icon-upload tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">رفع مؤهل/فحص</div>
            <div class="tile-sub">إرفاق مستندات الاعتماد</div>
          </div>
        </button>
        <button class="tile" data-view="eng-lathe">
          <span class="icon icon-lathe tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">مخرطة</div>
            <div class="tile-sub">عمليات الخراطة الخاصة بالمحرك</div>
          </div>
        </button>
        <button class="tile" data-view="eng-pump">
          <span class="icon icon-pump tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">بمبات ونوزلات</div>
            <div class="tile-sub">تتبع البمبات والنوزلات</div>
          </div>
        </button>
        <button class="tile" data-view="eng-elec">
          <span class="icon icon-electric tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">قسم الكهرباء</div>
            <div class="tile-sub">أعمال الكهرباء المرتبطة بالمحرك</div>
          </div>
        </button>
      </div>
    </section>
  </template>

  <!-- نماذج المحركات (نفس المنطق، تصميم أنظف) -->
  <template id="tpl-eng-supply">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return>
          <span class="icon icon-back"></span>
          <span>رجوع</span>
        </button>
        <h2>توريد محرك</h2>
      </div>
      <form class="card form" data-store="eng_supply">
        <div class="grid-3">
          <div class="field">
            <label>الرقم التسلسلي *</label>
            <input name="serial" class="input" required>
          </div>
          <div class="field">
            <label>نوع المحرك</label>
            <input name="engineType" class="input">
          </div>
          <div class="field">
            <label>الموديل</label>
            <input name="model" class="input">
          </div>
          <div class="field">
            <label>الموقع السابق</label>
            <input name="prevSite" class="input">
          </div>
          <div class="field">
            <label>تاريخ التوريد</label>
            <input name="supDate" type="date" class="input">
          </div>
          <div class="field">
            <label>المورد</label>
            <input name="supplier" class="input">
          </div>
          <div class="field grid-full">
            <label>ملاحظات</label>
            <textarea name="notes" rows="2" class="input"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-issue">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>صرف محرك</h2>
      </div>
      <form class="card form" data-store="eng_issue">
        <div class="grid-3">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>الموقع الحالي</label><input name="currSite" class="input"></div>
          <div class="field"><label>المستلم</label><input name="receiver" class="input"></div>
          <div class="field"><label>الطالب</label><input name="requester" class="input"></div>
          <div class="field"><label>تاريخ الصرف</label><input name="issueDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-rehab">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>تأهيل محرك</h2>
      </div>
      <form class="card form" data-store="eng_rehab">
        <div class="grid-3">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>الجهة المؤهلة</label><input name="rehabber" class="input"></div>
          <div class="field"><label>نوع التأهيل</label><input name="rehabType" class="input"></div>
          <div class="field"><label>تاريخ التأهيل</label><input name="rehabDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-check">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>فحص محرك</h2>
      </div>
      <form class="card form" data-store="eng_check">
        <div class="grid-3">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field grid-full"><label>وصف الفحص</label><textarea name="desc" rows="2" class="input"></textarea></div>
          <div class="field"><label>الفاحص</label><input name="inspector" class="input"></div>
          <div class="field"><label>تاريخ الفحص</label><input name="checkDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-upload">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>رفع مؤهل/فحص</h2>
      </div>
      <form class="card form" data-store="eng_upload">
        <div class="grid-3">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>رابط/ملف المؤهل</label><input name="rehabUp" class="input"></div>
          <div class="field"><label>رابط/ملف الفحص</label><input name="checkUp" class="input"></div>
          <div class="field"><label>تاريخ رفع المؤهل</label><input name="rehabUpDate" type="date" class="input"></div>
          <div class="field"><label>تاريخ رفع الفحص</label><input name="checkUpDate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-pump">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>بمبات ونوزلات</h2>
      </div>
      <form class="card form" data-store="eng_pump">
        <div class="grid-3">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>رقم البمب</label><input name="pumpSerial" class="input"></div>
          <div class="field grid-full"><label>تفاصيل التأهيل</label><textarea name="pumpRehab" rows="2" class="input"></textarea></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-eng-elec">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>قسم الكهرباء</h2>
      </div>
      <form class="card form" data-store="eng_electrical">
        <div class="grid-3">
          <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
          <div class="field"><label>نوع العمل</label><input name="etype" class="input"></div>
          <div class="field"><label>سلف</label><input name="starter" class="input"></div>
          <div class="field"><label>دينمو</label><input name="alternator" class="input"></div>
          <div class="field"><label>التاريخ</label><input name="edate" type="date" class="input"></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
          <button type="button" class="btn ghost" data-sync>مزامنة</button>
        </div>
      </form>
    </section>
  </template>

  <!-- التقارير -->
  <template id="tpl-reports">
    <section class="panel">
      <div class="view-head">
        <h2>التقارير والتصدير</h2>
        <p class="view-sub">توليد ملفات رسمية للمراجعة والتوثيق.</p>
      </div>
      <div class="card">
        <div class="row gap">
          <button id="openExport" class="btn primary">
            <span class="icon icon-download"></span>
            <span>فتح نافذة التصدير</span>
          </button>
          <button id="runRepair" class="btn ghost">
            <span class="icon icon-fix"></span>
            <span>إصلاح هيكل البيانات (بدون حذف)</span>
          </button>
        </div>
        <div class="hint mt">
          هذه العملية تتحقق من الأعمدة والحقول وتضيف الناقص فقط لضمان توافق التقارير مع بنية النظام.
        </div>
      </div>
    </section>
  </template>

  <!-- لوحة المولدات -->
  <template id="gen-home-tpl">
    <section class="panel">
      <div class="view-head">
        <h2>لوحة المولدات</h2>
        <p class="view-sub">إدارة بيانات المولدات من التوريد حتى الفحص.</p>
      </div>
      <div class="tile-grid">
        <button class="tile" data-view="gen-supply">
          <span class="icon icon-add tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">توريد مولد</div>
            <div class="tile-sub">تسجيل مولد جديد</div>
          </div>
        </button>
        <button class="tile" data-view="gen-issue">
          <span class="icon icon-exit tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">صرف مولد</div>
            <div class="tile-sub">تحريك المولد لموقع أو جهة</div>
          </div>
        </button>
        <button class="tile" data-view="gen-inspect">
          <span class="icon icon-check tile-icon"></span>
          <div class="tile-text">
            <div class="tile-title">فحص/رفع مولد</div>
            <div class="tile-sub">تحديث نتائج الفحص والوثائق</div>
          </div>
        </button>
      </div>
    </section>
  </template>

  <!-- نماذج المولدات (كما في منطقك السابق) -->
  <template id="gen-supply-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>توريد مولد</h2>
      </div>
      <form id="gen-supply-form" class="card form">
        <div class="grid-3">
          <div class="field"><label>الكود *</label><input id="gen_code" required class="input" /></div>
          <div class="field"><label>السعة</label><input id="gen_gType" class="input" /></div>
          <div class="field"><label>الموديل</label><input id="gen_model" class="input" /></div>
          <div class="field"><label>الموقع السابق</label><input id="gen_prevSite" class="input" /></div>
          <div class="field"><label>تاريخ التوريد</label><input id="gen_supDate" type="date" class="input" /></div>
          <div class="field"><label>الجهة</label><input id="gen_supplier" class="input" /></div>
          <div class="field"><label>المورد</label><input id="gen_vendor" class="input" /></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea id="gen_notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
        </div>
      </form>
    </section>
  </template>

  <template id="gen-issue-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>صرف مولد</h2>
      </div>
      <form id="gen-issue-form" class="card form">
        <div class="grid-3">
          <div class="field"><label>الكود *</label><input id="gi_code" required class="input" /></div>
          <div class="field"><label>تاريخ الصرف</label><input id="gi_issueDate" type="date" class="input" /></div>
          <div class="field"><label>المستلم</label><input id="gi_receiver" class="input" /></div>
          <div class="field"><label>الطالب</label><input id="gi_requester" class="input" /></div>
          <div class="field"><label>الموقع الحالي</label><input id="gi_currSite" class="input" /></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea id="gi_notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
        </div>
      </form>
    </section>
  </template>

  <template id="gen-inspect-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return><span class="icon icon-back"></span><span>رجوع</span></button>
        <h2>فحص/رفع مولد</h2>
      </div>
      <form id="gen-inspect-form" class="card form">
        <div class="grid-3">
          <div class="field"><label>الكود *</label><input id="gins_code" required class="input" /></div>
          <div class="field"><label>المفتش</label><input id="gins_inspector" class="input" /></div>
          <div class="field"><label>تأهيل كهربائي</label><input id="gins_elecRehab" class="input" /></div>
          <div class="field"><label>تاريخ التأهيل</label><input id="gins_rehabDate" type="date" class="input" /></div>
          <div class="field"><label>رفع المؤهل</label><input id="gins_rehabUp" class="input" /></div>
          <div class="field"><label>رفع الفحص</label><input id="gins_checkUp" class="input" /></div>
          <div class="field grid-full"><label>ملاحظات</label><textarea id="gins_notes" class="input"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
        </div>
      </form>
    </section>
  </template>

  <script src="app.js" defer></script>
</body>
</html>

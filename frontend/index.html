<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>السامي لإدارة الورشة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- شريط علوي -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-logo">⚙️</div>
      <div class="brand-info">
        <div class="brand-title">السامي لإدارة الورشة</div>
        <div class="brand-sub">نظام محركات ومولدات للشركات</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="status-pill">
        <span id="onlineDot" class="dot online"></span>
        <span id="onlineText" class="status-text">متصل</span>
      </div>
      <button id="btnSettings" class="icon-btn" title="إعدادات الاتصال">⚙️</button>
      <button id="btnBell" class="icon-btn" title="الإشعارات">🔔<span id="bellCount" class="badge">0</span></button>
      <button id="btnLogout" class="pill-btn pill-danger" title="تسجيل الخروج">خروج</button>
    </div>
  </header>

  <!-- تخطيط رئيسي -->
  <div class="shell">
    <!-- شريط جانبي مبسط بدون تكرار داخلي -->
    <aside class="sidebar">
      <nav class="nav">
        <div class="nav-section-label">القائمة الرئيسية</div>
        <button data-view="home"    class="nav-item active">الواجهة الرئيسية</button>
        <button data-view="engines" class="nav-item">لوحة المحركات</button>
        <button data-view="gen-home" class="nav-item">لوحة المولدات</button>
        <button data-view="reports" class="nav-item">التقارير والتصدير</button>
      </nav>
    </aside>

    <!-- محتوى -->
    <main class="content">

      <!-- شريط أدوات البحث في الأعلى (ثابت - مركز رئيسي للبحث) -->
      <section class="toolbar">
        <div class="search-wrap">
          <input id="searchInput" class="input main-search"
                 placeholder="بحث: رقم تسلسلي محرك أو كود مولد..." />
          <button id="btnSearch" class="btn primary">بحث</button>
          <button id="btnQuickExport" class="btn ghost">تصدير سريع</button>
        </div>
      </section>

      <!-- منطقة العرض -->
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <!-- نافذة إعدادات API -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>إعدادات الاتصال بالخادم</h3>
        <button id="closeSettings" class="icon-btn">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>رابط API</label>
          <input id="apiBaseInput" class="input" placeholder="مثال: https://workshop-appsys.onrender.com/api" />
          <div class="hint">يمكن تغيير الرابط في حال نقل الخادم أو استخدام بيئة محلية.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveApiBase" class="btn primary">حفظ</button>
        <button id="cancelSettings" class="btn ghost">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة التصدير -->
  <div id="exportModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>تصدير إلى Excel</h3>
        <button id="closeExport" class="icon-btn">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>نوع البيانات</label>
          <div class="chip-row">
            <label class="chip"><input type="radio" name="exportType" value="engines" checked> المحركات</label>
            <label class="chip"><input type="radio" name="exportType" value="generators"> المولدات</label>
            <label class="chip"><input type="radio" name="exportType" value="both"> الكل</label>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>من تاريخ</label>
            <input id="fromDate" type="date" class="input" />
          </div>
          <div class="field">
            <label>إلى تاريخ</label>
            <input id="toDate" type="date" class="input" />
          </div>
        </div>
        <div class="hint">اترك التواريخ فارغة لتصدير جميع السجلات.</div>
      </div>
      <div class="modal-footer">
        <button id="doExport" class="btn primary">تصدير</button>
        <button id="cancelExport" class="btn ghost">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- القوالب -->

  <!-- واجهة رئيسية: 7 أيقونات كبيرة واضحة -->
  <template id="tpl-home">
    <div class="card">
      <div class="card-title">لوحة التحكم الرئيسية</div>
      <div class="tile-grid home-tiles">
        <button class="tile" data-go="home">
          🔍 البحث
          <span>بحث مباشر في المحركات والمولدات</span>
        </button>
        <button class="tile" data-view="engines">
          🧰 لوحة المحركات
          <span>إدخال وتتبع جميع عمليات المحركات</span>
        </button>
        <button class="tile" data-view="gen-home">
          🔌 لوحة المولدات
          <span>إدارة توريد وصرف وفحص المولدات</span>
        </button>
        <button class="tile" data-go="home">
          🆕 آخر 3 محركات
          <span>عرض أحدث توريدات المحركات</span>
        </button>
        <button class="tile" data-go="home">
          ⚡ آخر 3 مولدات
          <span>عرض أحدث توريدات المولدات</span>
        </button>
        <button class="tile" data-view="reports">
          📑 التصدير
          <span>توليد تقارير Excel رسمية</span>
        </button>
        <button class="tile" data-go="home">
          📊 الحالة
          <span>مؤشرات حالة النظام والاتصال</span>
        </button>
      </div>
    </div>

    <!-- كروت سريعة للآخر 3 + الحالة + نتائج البحث -->
    <div class="grid-3 home-grid">
      <div class="card metric">
        <div class="metric-header">
          <span class="metric-icon">🧰</span>
          <span class="metric-title">آخر 3 محركات</span>
        </div>
        <div id="last3Engines" class="metric-body"></div>
      </div>

      <div class="card metric">
        <div class="metric-header">
          <span class="metric-icon">🔌</span>
          <span class="metric-title">آخر 3 مولدات</span>
        </div>
        <div id="last3Generators" class="metric-body"></div>
      </div>

      <div class="card metric">
        <div class="metric-header">
          <span class="metric-icon">📊</span>
          <span class="metric-title">حالة النظام</span>
        </div>
        <ul class="status-list">
          <li>اتصال الخادم: <span id="srvStatus" class="tag ok">جيد</span></li>
          <li>إصدار الواجهة: <span class="tag">v4.0</span></li>
          <li>مطور النظام: <span class="tag">ALSAMI</span></li>
        </ul>
      </div>
    </div>

    <div class="card">
      <div class="card-title">نتائج البحث</div>
      <div id="searchOutput" class="search-results"></div>
    </div>
  </template>

  <!-- لوحة المحركات (كما هي منطقياً، فقط بشكل أنظف) -->
  <template id="tpl-engines">
    <div class="view-head">
      <button class="btn back" data-return>↩ رجوع</button>
      <h2>لوحة المحركات</h2>
    </div>
    <div class="tile-grid">
      <button class="tile" data-view="eng-supply">توريد محرك</button>
      <button class="tile" data-view="eng-issue">صرف محرك</button>
      <button class="tile" data-view="eng-rehab">تأهيل محرك</button>
      <button class="tile" data-view="eng-check">فحص محرك</button>
      <button class="tile" data-view="eng-upload">رفع مؤهل/فحص</button>
      <button class="tile" data-view="eng-lathe">مخرطة</button>
      <button class="tile" data-view="eng-pump">بمبات ونوزلات</button>
      <button class="tile" data-view="eng-elec">كهرباء</button>
    </div>
  </template>

  <!-- نفس النماذج السابقة للمحركات (بدون تغيير المنطق) -->
  <template id="tpl-eng-supply">
    <div class="view-head">
      <button class="btn back" data-return>↩ رجوع</button><h2>توريد محرك</h2>
    </div>
    <form class="card form" data-store="eng_supply">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>نوع المحرك</label><input name="engineType" class="input"></div>
        <div class="field"><label>الموديل</label><input name="model" class="input"></div>
        <div class="field"><label>الموقع السابق</label><input name="prevSite" class="input"></div>
        <div class="field"><label>تاريخ التوريد</label><input name="supDate" type="date" class="input"></div>
        <div class="field"><label>المورد</label><input name="supplier" class="input"></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <template id="tpl-eng-issue">
    <div class="view-head"><button class="btn back" data-return>↩ رجوع</button><h2>صرف محرك</h2></div>
    <form class="card form" data-store="eng_issue">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>الموقع الحالي</label><input name="currSite" class="input"></div>
        <div class="field"><label>المستلم</label><input name="receiver" class="input"></div>
        <div class="field"><label>الطالب</label><input name="requester" class="input"></div>
        <div class="field"><label>تاريخ الصرف</label><input name="issueDate" type="date" class="input"></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <template id="tpl-eng-rehab">
    <div class="view-head"><button class="btn back" data-return>↩ رجوع</button><h2>تأهيل محرك</h2></div>
    <form class="card form" data-store="eng_rehab">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>الجهة المؤهلة</label><input name="rehabber" class="input"></div>
        <div class="field"><label>نوع التأهيل</label><input name="rehabType" class="input"></div>
        <div class="field"><label>تاريخ التأهيل</label><input name="rehabDate" type="date" class="input"></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <template id="tpl-eng-check">
    <div class="view-head"><button class="btn back" data-return>↩ رجوع</button><h2>فحص محرك</h2></div>
    <form class="card form" data-store="eng_check">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>الفاحص</label><input name="inspector" class="input"></div>
        <div class="field grid-full"><label>وصف الفحص</label><textarea name="desc" rows="2" class="input"></textarea></div>
        <div class="field"><label>تاريخ الفحص</label><input name="checkDate" type="date" class="input"></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <template id="tpl-eng-upload">
    <div class="view-head"><button class="btn back" data-return>↩ رجوع</button><h2>رفع مؤهل/فحص</h2></div>
    <form class="card form" data-store="eng_upload">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>رفع المؤهل</label><input name="rehabUp" class="input"></div>
        <div class="field"><label>رفع الفحص</label><input name="checkUp" class="input"></div>
        <div class="field"><label>تاريخ رفع المؤهل</label><input name="rehabUpDate" type="date" class="input"></div>
        <div class="field"><label>تاريخ رفع الفحص</label><input name="checkUpDate" type="date" class="input"></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <template id="tpl-eng-pump">
    <div class="view-head"><button class="btn back" data-return>↩ رجوع</button><h2>بمبات ونوزلات</h2></div>
    <form class="card form" data-store="eng_pump">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>رقم البمب</label><input name="pumpSerial" class="input"></div>
        <div class="field grid-full"><label>تأهيل البمب</label><textarea name="pumpRehab" rows="2" class="input"></textarea></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <template id="tpl-eng-elec">
    <div class="view-head"><button class="btn back" data-return>↩ رجوع</button><h2>قسم الكهرباء</h2></div>
    <form class="card form" data-store="eng_electrical">
      <div class="grid-3">
        <div class="field"><label>الرقم التسلسلي *</label><input name="serial" class="input" required></div>
        <div class="field"><label>نوع العمل</label><input name="etype" class="input"></div>
        <div class="field"><label>سلف</label><input name="starter" class="input"></div>
        <div class="field"><label>دينمو</label><input name="alternator" class="input"></div>
        <div class="field"><label>التاريخ</label><input name="edate" type="date" class="input"></div>
        <div class="field grid-full"><label>ملاحظات</label><textarea name="notes" rows="2" class="input"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" class="btn ghost" data-sync>مزامنة ↻</button>
      </div>
    </form>
  </template>

  <!-- التقارير -->
  <template id="tpl-reports">
    <div class="view-head">
      <button class="btn back" data-return>↩ رجوع</button>
      <h2>التقارير والتصدير</h2>
    </div>
    <div class="card">
      <div class="row gap">
        <button id="openExport" class="btn primary">فتح نافذة التصدير</button>
        <button id="runRepair" class="btn ghost">إصلاح المخطط (Repair)</button>
      </div>
      <div class="hint mt">لن يتم حذف أي بيانات، فقط سيتم إضافة الأعمدة الناقصة إن وجدت.</div>
    </div>
  </template>

  <!-- لوحة المولدات -->
  <template id="gen-home-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return>↩ رجوع</button>
        <h2>لوحة المولدات</h2>
      </div>
      <div class="tile-grid">
        <button class="tile" data-view="gen-supply">توريد مولد</button>
        <button class="tile" data-view="gen-issue">صرف مولد</button>
        <button class="tile" data-view="gen-inspect">فحص/رفع مولد</button>
      </div>
    </section>
  </template>

  <!-- نماذج المولدات كما هي (متوافقة مع app.js) -->
  <template id="gen-supply-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return>↩ رجوع</button>
        <h3>توريد مولد</h3>
      </div>
      <form id="gen-supply-form" class="card form">
        <div class="field"><label>الكود *</label><input id="gen_code" required class="input" /></div>
        <div class="field"><label>السعة</label><input id="gen_gType" class="input" /></div>
        <div class="field"><label>الموديل</label><input id="gen_model" class="input" /></div>
        <div class="field"><label>الموقع السابق</label><input id="gen_prevSite" class="input" /></div>
        <div class="field"><label>تاريخ التوريد</label><input id="gen_supDate" type="date" class="input" /></div>
        <div class="field"><label>الجهة</label><input id="gen_supplier" class="input" /></div>
        <div class="field"><label>المورد</label><input id="gen_vendor" class="input" /></div>
        <div class="field"><label>ملاحظات</label><textarea id="gen_notes" class="input"></textarea></div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
        </div>
      </form>
    </section>
  </template>

  <template id="gen-issue-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return>↩ رجوع</button>
        <h3>صرف مولد</h3>
      </div>
      <form id="gen-issue-form" class="card form">
        <div class="field"><label>الكود *</label><input id="gi_code" required class="input" /></div>
        <div class="field"><label>تاريخ الصرف</label><input id="gi_issueDate" type="date" class="input" /></div>
        <div class="field"><label>المستلم</label><input id="gi_receiver" class="input" /></div>
        <div class="field"><label>الطالب</label><input id="gi_requester" class="input" /></div>
        <div class="field"><label>الموقع الحالي</label><input id="gi_currSite" class="input" /></div>
        <div class="field"><label>ملاحظات</label><textarea id="gi_notes" class="input"></textarea></div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
        </div>
      </form>
    </section>
  </template>

  <template id="gen-inspect-tpl">
    <section class="panel">
      <div class="view-head">
        <button class="btn back" data-return>↩ رجوع</button>
        <h3>فحص/رفع مولد</h3>
      </div>
      <form id="gen-inspect-form" class="card form">
        <div class="field"><label>الكود *</label><input id="gins_code" required class="input" /></div>
        <div class="field"><label>المفتش</label><input id="gins_inspector" class="input" /></div>
        <div class="field"><label>تأهيل كهربائي</label><input id="gins_elecRehab" class="input" /></div>
        <div class="field"><label>تاريخ التأهيل</label><input id="gins_rehabDate" type="date" class="input" /></div>
        <div class="field"><label>رفع المؤهل</label><input id="gins_rehabUp" class="input" /></div>
        <div class="field"><label>رفع الفحص</label><input id="gins_checkUp" class="input" /></div>
        <div class="field"><label>ملاحظات</label><textarea id="gins_notes" class="input"></textarea></div>
        <div class="form-actions">
          <button type="submit" class="btn primary">حفظ</button>
        </div>
      </form>
    </section>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
